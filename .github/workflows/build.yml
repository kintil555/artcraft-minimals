name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: artcraft-launcher
            target: linux-x86_64
          - os: windows-latest
            bin: artcraft-launcher.exe
            target: windows-x64
          - os: macos-latest
            bin: artcraft-launcher
            target: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Version
        id: ver
        shell: bash
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            # Every push to main is a release: <major>.<minor>.<run number>.
            V="${BASE%.*}.${GITHUB_RUN_NUMBER}"
          else
            V="$BASE"
          fi
          # The binary must report the release's version, or it would offer itself as an update forever.
          perl -0pi -e "s/^version = \".*?\"/version = \"$V\"/m" Cargo.toml
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          # Only the workspace crates' own versions may change; every other dependency stays locked.
          cargo update --workspace
          cargo build --release --locked -p artcraft-launcher

      # Asset names follow what the launcher's self-update looks for:
      # artcraft-launcher-<version>-<os>-<arch>[-portable.zip | .tar.gz]
      - name: Package
        shell: bash
        run: |
          NAME="artcraft-launcher-${{ steps.ver.outputs.v }}-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir "$NAME"
            cp "target/release/${{ matrix.bin }}" LICENSE-MIT LICENSE-APACHE NOTICE "$NAME/"
            : > "$NAME/portable.txt"
            7z a "${NAME}-portable.zip" "$NAME"
          else
            mkdir dist
            cp "target/release/${{ matrix.bin }}" LICENSE-MIT LICENSE-APACHE NOTICE dist/
            tar -czf "${NAME}.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            artcraft-launcher-*-portable.zip
            artcraft-launcher-*.tar.gz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          V="$(ls assets/artcraft-launcher-*-linux-x86_64.tar.gz | sed -E 's/.*artcraft-launcher-(.*)-linux-x86_64\.tar\.gz/\1/')"
          gh release create "v$V" assets/* --repo "${{ github.repository }}" --target "$GITHUB_SHA" --generate-notes
